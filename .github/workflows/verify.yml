name: Rust tests and bounded proof portfolio

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: Regex selecting harness names (empty = whole portfolio)
        type: string
        default: ''
      timeout_seconds:
        description: Per-harness limit in seconds (60-3600)
        type: string
        default: '1500'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KANI_SHARDS: '16'

jobs:
  rust:
    name: Locked Rust checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: rustup override set 1.98.0
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --features colada/test,colada/fuzz --locked
      - run: cargo run --example position --locked

  plan:
    name: Plan Kani replay
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          # Empty on a manual run: every package is replayed.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          packages=$(python3 scripts/kani_ci.py affected "$BASE")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [ -n "$packages" ]; then
            echo "matrix=$(python3 scripts/kani_ci.py plan --shards "$KANI_SHARDS" --only "$ONLY" --packages "$packages")" >> "$GITHUB_OUTPUT"
          fi

  kani:
    name: Kani / ${{ matrix.package }} / shard ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.packages != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: rustup override set 1.98.0
      - run: cargo install --locked kani-verifier --version 0.67.0
      - run: cargo kani setup
      - name: Replay shard (gate judges outcomes)
        env:
          KANI_PACKAGE: ${{ matrix.package }}
          KANI_CONTINUE_ON_FAILURE: '1'
          KANI_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || '1500' }}
          KANI_OBJECT_BITS: ${{ matrix.package == 'colada-engine' && '14' || '12' }}
          KANI_RESULTS_FILE: target/kani-audit/${{ matrix.package }}/results.tsv
          HARNESSES: ${{ toJSON(matrix.harnesses) }}
        run: |
          mapfile -t proofs < <(python3 -c 'import json,os; print("\n".join(json.loads(os.environ["HARNESSES"])))')
          bash scripts/run_kani_full_audit.sh "${proofs[@]}" || echo 'Shard finished with non-PASS outcomes; see gate.'
      - name: Upload shard results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kani-${{ matrix.package }}-${{ matrix.shard }}
          if-no-files-found: error
          path: |
            target/kani-audit/${{ matrix.package }}/results.tsv
            target/kani-audit/**/*.log

  gate:
    name: Kani result matrix gate
    needs: [plan, kani]
    if: always() && needs.plan.outputs.packages != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: kani-*
          path: kani-results
      - name: Publish every harness outcome and enforce regressions
        if: always()
        env:
          ONLY: ${{ inputs.only }}
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: python3 scripts/kani_ci.py gate kani-results --only "$ONLY" --packages "$PACKAGES"
