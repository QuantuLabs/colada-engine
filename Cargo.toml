# Derived from aeyakovenko/percolator at d8dad98 (Apache-2.0); modified by QuantuLabs.
[package]
name = "colada-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["QuantuLabs"]
description = "Stateless no_std numerical kernel of the Colada perpetual-futures risk engine"
publish = false
repository = "https://github.com/QuantuLabs/colada-engine"
readme = "README.md"

[lib]
name = "colada_engine"
path = "src/lib.rs"

[dependencies]
# No runtime dependencies - pure no_std compatible library

[dev-dependencies]
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
overflow-checks = true

[profile.sbf]
inherits = "release"
panic = "abort"

[workspace]
members = [".", "percolator"]
default-members = ["."]
resolver = "2"

[workspace.metadata.kani]
flags = { tests = true }
unstable = { stubbing = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
